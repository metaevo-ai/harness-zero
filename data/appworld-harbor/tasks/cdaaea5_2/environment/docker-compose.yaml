services:
  main:
    image: ahd-appworld-client:v2
    command: ["appworld", "serve"]
    cap_drop: [ALL]
    # Harbor uploads files with host ownership; AHD must chmod its CLI wrapper.
    cap_add: [FOWNER]
    security_opt: ["no-new-privileges:true"]
    networks: [appworld]
    depends_on:
      world:
        condition: service_healthy
  world:
    image: ahd-appworld-world:v3
    command: ["python", "/opt/appworld_env/server.py"]
    environment:
      APPWORLD_TASK_ID: "cdaaea5_2"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
      - /opt/appworld/experiments
    volumes:
      - world-export:/export
    networks: [appworld]
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 2s
      retries: 60
networks:
  appworld:
    internal: true
    # Internal networks otherwise still expose services on the host bridge IP.
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
volumes:
  world-export:
